         tests; yours must be 30 + your new tests, all green.
      4. Write your OWN throwaway probe under /tmp (never inside the repo) that imports
         the module and checks, independently of the producer's tests:
         - encrypt -> decrypt round trip
         - two encryptions of the same plaintext differ
         - flipping one byte of the ciphertext makes decrypt THROW
         - a value encrypted under key id A still decrypts after A is retired but B is
           active, and re-encrypts under B
         - timingSafeEqualString does not throw on a length mismatch
      5. Run `npx tsc --noEmit` and report the real count. The baseline is 54
