    verify_prompt: |
      READ-ONLY adversarial cryptographic verification. Do NOT edit, create or delete any
      project file.
      You are verifying the encryption core in /workspace/propdesk.

      1. Read lib/crypto/field-encryption.ts line by line. Check the AES-256-GCM usage
         is cryptographically CORRECT: a 12-byte random IV, the right key length, the
         authTag retrieved AND verified on decrypt, no IV reuse, and an unambiguous
         envelope encoding. A decrypt that ignores the auth tag and returns garbage is
         an automatic FAIL. A decrypt that silently returns plaintext for a corrupt
         value is an automatic FAIL.
      2. Check key handling: grep the whole repo for the key env var names and confirm
         the material is never hardcoded, never in a NEXT_PUBLIC_ variable, never
         logged, and never returned in an API response. Confirm a missing or wrong-length
