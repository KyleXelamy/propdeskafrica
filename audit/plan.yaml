         design: private buckets for tenant documents, ownership-scoped access,
         short-lived signed URLs instead of public URLs for sensitive files.
         Put the SQL in a new file under db/migrations/ (numbered after the
         existing ones) and ALSO document it — do not silently change an applied
         migration.
      6. **Security headers** — add the missing headers to next.config.mjs
         `headers()` alongside the existing ones: a Content-Security-Policy
         (report-only is acceptable if you also explain the enforcement path),
         includeSubDomains + preload on HSTS, and a complete Permissions-Policy.
         Do not break the existing header set.
      7. **Rate limiting** — implement a small, dependency-free in-memory rate
         limiter (a fixed-window counter with a Map and a periodic sweep) in
         lib/api/rate-limit.ts and apply it to the abuse-prone public endpoints
         that the infra audit named: sign-up, forgot-password, contact, newsletter,
         feedback, customer-requests, the M-Pesa STK push, and checkout. Apply it
         via the existing route wrappers. Document the limitation clearly (it is
         per-instance and does not work across serverless instances) and note that
         a Redis/Upstash-backed store is the production follow-up.
      8. **Audit log** — implement the minimal audit-log design: table shape in a
         new db/migrations file, a helper to record who accessed or changed
         sensitive records, and a hook it into the most sensitive read/write
         paths. Never log PII into the audit log itself.

      ## Constraints
      - The encryption MUST be backward compatible with existing plaintext rows:
         the decrypt helper must detect a plaintext value and return it as-is
         (so the app keeps working before the backfill runs). The backfill script
         must be provided as a standalone script under scripts/ (e.g.
         scripts/backfill-encryption.ts) that is idempotent and dry-run capable.
         Include it in package.json as `db:encrypt-backfill`.
      - Do NOT change any existing route's public contract.
      - Do NOT drop or rename any existing column. Additive-only migrations.
       Never edit an already-applied migration file — add new numbered ones.
      - Run `npx tsc --noEmit` and ensure NO new type errors vs baseline. The
         Node crypto types come from @types/node — verify they resolve.
      - Run `npm test` and ensure the suite still passes.
      - Do NOT `git commit`.

      ## Output
      1. Update crypto.json statuses (FIXED / WONT_FIX) with fix_notes.
      2. /workspace/propdesk/audit/deliverable-hardening.md: every change, the
         files added and changed, the env vars now required and how to generate
         them, the migration order to run, the backfill command and its dry-run
         usage, the rate-limiter limitation, the tsc baseline vs post-fix error
         count, and the test output.
      3. A runnable smoke check that proves encryption round-trips
         (encrypt → decrypt equals the original; blindIndex is stable for equal
         inputs and differs for different inputs; a ciphertext under a rotated
         key id still decrypts). Make it a real vitest test file so it runs in
         `npm test` — e.g. lib/crypto/field-encryption.test.ts.
    verify_prompt: |
      READ-ONLY adversarial verification. Do not modify any project file.
      Verify the hardening work in /workspace/propdesk independently.
      1. Read lib/crypto/field-encryption.ts line by line. Check the AES-256-GCM
         usage is cryptographically correct: 12-byte random IV, correct key
         length, authTag retrieved and verified, no IV reuse across calls, and
         the envelope encoding is unambiguous (fixed offsets, no delimiter
         ambiguity). Verify authTag verification actually happens — a decrypt
         that ignores the tag and silently returns garbage is a FAIL.
      2. Run the crypto tests yourself: `npm test` in /workspace/propdesk, and
         specifically `npx vitest run lib/crypto/field-encryption.test.ts`.
         Verify a round-trip, a blind-index stability check, and the key-rotation
         case actually pass. Write any throwaway probe ONLY under /tmp.
      3. Verify the backward-compatibility path: a plaintext legacy value must
         decrypt to itself without throwing, and must be flagged as needing
         migration. Test it yourself with a throwaway script in /tmp.
      4. Verify the key handling: grep the whole repo for the key env var name
         and confirm it is never hardcoded, never in a NEXT_PUBLIC_ var, never
         logged, and never returned in an API response. Also confirm the .env.example
         you were told to add contains ONLY placeholders, and that it does not
         overwrite a pre-existing file.
      5. Verify the rate limiter: it must actually reject (not just count), it
         must not accidentally block legitimate distinct users sharing a header,
         and its Map must not grow without bound. Test it directly.
      6. Verify the migrations: only NEW numbered files were added, no existing
         migration was edited (`git -C /workspace/propdesk diff 467c500 -- db/`),
         and every statement is additive (no DROP / RENAME / destructive ALTER).
      7. Verify the storage policy SQL would actually deny cross-tenant reads —
         read it as a Postgres/Supabase policy expert and reason about the USING
         clause. A policy that permits all authenticated users is a FAIL.
      8. Run `npx tsc --noEmit` and `npm test` yourself; report the real results.
      FAIL if: the crypto is subtly wrong (IV reuse, missing tag verification,
         ambiguous encoding, plaintext legacy values throwing), the key is exposed
         anywhere, the rate limiter does not actually block, a migration is
         destructive, the storage policy permits cross-tenant reads, or new type
         errors/tests failures exist. PASS only if you personally confirmed all of
         the above. State exactly what is wrong on FAIL.

  - id: final-audit-report
    title: 'Synthesize the launch-readiness audit report and remediation guide'
    assigned_to: General
    depends_on: [harden-crypto]
    verified_by: Verifier
    timeout_ms: 1800000
    prompt: |
      Write the final deliverable for the PropDesk Africa pre-launch audit.

      ## READ FIRST: /workspace/propdesk/audit/ENVIRONMENT.md
      It records the already-completed environment setup (node_modules installed, the
      54 pre-existing tsc errors that are the BASELINE and not yours to fix, the
      3 passing baseline tests, the architecture cheat-sheet, the severity ladder,
      and the global ground rules: no git commit, do not touch audit/findings/
      except your own files, zero NEW type errors, suite must stay green).

      ## Inputs — read ALL of these
      - /workspace/propdesk/audit/findings/*.md and *.json (authz, leaks, infra,
        features, crypto)
      - /workspace/propdesk/audit/deliverable-*.md (fix-security,
        security-tests, feature-completion, hardening)
      - /workspace/propdesk/audit/design/encryption-design.md and
        /workspace/propdesk/audit/design/feature-plans/*.md
      - The actual current code and the diff against the baseline commit 467c500
        (`git -C /workspace/propdesk diff 467c500 --stat`)

      ## Output — write these files at the repo root
      1. **AUDIT_REPORT.md** — the document the owner reads to decide whether to
         launch. Structure:
         - **Launch verdict**: one of NO-GO / GO-WITH-CONDITIONS / GO. State the
           conditions explicitly. Be decisive — do not hedge into uselessness.
         - **Executive summary** — what the platform is, its risk profile, and the
           5 most important things the owner must know, in plain language a
           non-engineer founder can act on. Mention anything that must happen
           BEFORE the site goes public.
         - **What was fixed** — table of every closed finding: ID, severity,
           area, one-line description, file(s) changed, verification performed.
         - **What remains open** — table of every open finding: ID, severity, area,
           impact, recommended action, and effort. Be honest about anything left.
         - **By-category breakdown** — authz, leaks, infra, features, crypto: how
           many findings, how many fixed, the residual risk, and what the residual
           risk means in practice.
         - **Infrastructure exposure assessment** — a direct, specific answer to
           the owner's question "where have we exposed our infrastructure?":
           which endpoints, which secrets, which surfaces, what an attacker could
           reach before the fixes and what they can reach now.
         - **Feature completeness assessment** — direct answer to "which features
           are half done?", with a clear table of shipped vs stubbed vs pending,
           and a realistic shipping recommendation.
         - **Known limitations & residual risk** — the per-instance rate limiter,
           the application-level tenancy without RLS, the Neon/Supabase dual
           database, the unencrypted legacy rows pending backfill, and anything
           else a future reader must know. Be candid.
         - **Appendix**: the full finding list and a file-by-file change manifest.
      2. **HARDENING_RUNBOOK.md** — the operational guide, in order:
         - **Pre-launch checklist** — every step that must be done before going
           live, as a checkbox list, with the exact command where one exists
           (env vars to set, migrations to run, `npm run db:encrypt-backfill`
           dry-run then real run, `npm run db:migrate`, `npm test`, `npx tsc --noEmit`,
           `npm run build`).
         - **Required environment variables** — a table of every env var the app
           now needs, whether it is server-only or NEXT_PUBLIC, a safe placeholder
           value, and how to generate the secret ones.
         - **Database migration order** — the numbered migration files, what each
           does, and how to apply them.
         - **Data backfill procedure** — the encryption backfill, idempotency,
           dry-run, verification queries, and rollback.
         - **Key rotation procedure** — step by step, with the commands.
         - **Deployment checklist** — the order of operations for a safe release,
           including what to verify in production and what to roll back.
         - **Ongoing maintenance** — what to review monthly, and the checks to add
           to CI.
      3. **CHANGELOG.md** — a conventional-changelog style file listing every
         change made during this hardening pass, grouped as
         [Security], [Fixed], [Added], [Changed]. Reference finding IDs.
      4. Update /workspace/propdesk/.env.example if it does not exist — create it
         with placeholder values only for every env var the app reads.

      ## Style
      - The owner is the founder, not a security engineer. Lead with impact and
        action, not with CVE jargon. Keep the technical detail in the tables.
      - Every claim in the report must trace to a finding ID, a changed file, or
        a command output. Do not invent numbers, counts, or status.
      - Do not run `git commit`.
      - Do not modify application source code in this task. You are writing
        documentation only.
    verify_prompt: |
      READ-ONLY verification of the final deliverable. Do not modify any project file.
      Verify the documents in /workspace/propdesk (AUDIT_REPORT.md,
      HARDENING_RUNBOOK.md, CHANGELOG.md, .env.example).
      1. FACT-CHECK EVERY COUNT AND CLAIM. Recount the findings in
         /workspace/propdesk/audit/findings/*.json by status and severity and
         confirm every number, table count and verdict in AUDIT_REPORT.md matches.
         A report claiming 12 fixed findings when the JSON says 9 is a FAIL.
      2. VERIFY THE CHANGELOG against reality: run
         `git -C /workspace/propdesk diff 467c500 --stat` and confirm every
         changed file named in the CHANGELOG actually changed, and that no
         significant changed file is missing from it.
      3. VERIFY THE RUNBOOK IS EXECUTABLE. Check every command it lists actually
         exists: the npm scripts in package.json, the migration files in
         db/migrations/, the backfill script in scripts/. If a runbook step
         references a script or file that does not exist, that is a FAIL — a
         runbook that fails on step 3 is worthless.
      4. VERIFY .env.example: it must contain a placeholder (never a real
         secret) for every env var the code reads (grep process.env across lib/
         and app/), and must not contain any value that looks like a real
         credential. Confirm it does not overwrite a pre-existing file with
         different content.
      5. CHECK THE VERDICT IS CONSISTENT: if any CRITICAL finding is still OPEN
         in the JSON, the launch verdict must not be a plain GO.
      6. Check the documents do not overstate: no claim of "encrypted at rest"
         unless the code and backfill support it; no claim of "tests pass" unless
         the suite passes — run `npm test` yourself in /workspace/propdesk and
         report the real result.
      FAIL if: any count or status in the report is wrong; a runbook step
         references a non-existent script or file; the changelog does not match
         the real diff; .env.example is missing a var or contains a real secret;
         the verdict contradicts the open findings; or a factual claim is
         unsupported. PASS if every claim is traceable and every command works.
         State exactly what is wrong when you FAIL.
