  - id: audit-crypto
    title: 'Design encryption-at-rest, key management and data-protection hardening'
    assigned_to: General
    verified_by: Verifier
    timeout_ms: 1800000
    prompt: |
      READ-ONLY design track for /workspace/propdesk. Do NOT modify application source
      in this track. Only create files under /workspace/propdesk/audit/findings/ and
      /workspace/propdesk/audit/design/.

      Context: PropDesk Africa handles sensitive data for Kenyan landlords and
      tenants: national ID numbers, phone numbers, emails, physical addresses, bank
      and M-Pesa account identifiers, lease agreements, invoices, payment records,
      uploaded identity documents and property photos. The platform stores this in
      Neon Postgres (HTTP driver, @neondatabase/serverless) with Supabase Storage
      for files. The owner asked for "code hardening and encryption etc etc".
      Your job is to produce the concrete, implementable encryption + data-protection
      design that the next cycle will build.

      ## What to determine
      1. DATA INVENTORY — which tables/columns hold what class of data? Read
         db/migrations/001-core.sql, db/migrations/002-support.sql and the query
         code in app/api/**. Produce a table of: table.column, data class
         (public / internal / PII / sensitive PII / financial / credential),
         whether it is currently stored in plaintext, and whether it is already
         protected by application-layer tenant scoping.
      2. ENCRYPTION DESIGN — design application-layer encryption at rest for the
         sensitive PII columns (at minimum: tenant national ID number, tenant phone
         number, any M-Pesa/bank account identifiers, any document metadata that
         leaks identity). Specify concretely:
         - Node's built-in `node:crypto` AES-256-GCM (authenticated encryption) —
           why it is the right choice here (no new native dependency, works on
           Vercel serverless, no WASM/build breakage) and how it compares to
           libsodium, AWS KMS and pgcrypto.
         - The exact envelope: iv (12 random bytes) + authTag + ciphertext, stored
           as a single base64 string with a version prefix, e.g. `v1:<iv>:<tag>:<ct>`
           so the scheme can be rotated later.
         - Key material: a master key from an env var (e.g. PROPDESK_ENCRYPTION_KEY),
           32 bytes base64, NEVER hardcoded, NEVER logged, NEVER sent to the client.
         - A key registry supporting multiple active key ids (for rotation) and a
           decrypt-with-fallback decrypts-then-reencrypts pattern.
         - Deterministic vs randomised: which columns need deterministic encryption
           (search/lookup, e.g. a searchable phone number) and how to do it safely
           — recommend a blind index (HMAC-SHA256 with a separate key) rather than
           a deterministic cipher, and explain the trade-off.
         - Where the crypto helper lives (e.g. lib/crypto/field-encryption.ts),
           its exact exported API, and the code shape for encrypt/decrypt/blind-index.
         - A safe search/filter strategy for encrypted columns.
      3. PASSWORD AND AUTH CRYPTO — check how passwords and OTP codes are handled
         (Supabase auth handles password hashing — confirm and say so rather than
         inventing a scheme). Identify anything the app itself hashes or compares:
         M-Pesa callback secrets, CRON_SECRET, MIGRATION_SECRET, Stripe webhook
         signature verification. Check every secret comparison for TIMING-SAFE
         comparison (crypto.timingSafeEqual) and for string === comparisons, and
         for length-leak issues with timingSafeEqual (it throws on unequal
         lengths — show the correct guarded pattern).
      4. STORAGE PROTECTION — Supabase Storage policies for property photos,
         avatars and tenant documents. Can a signed-in user read another landlord's
         file by guessing a path? Is the bucket public? Should documents be
         served via short-lived signed URLs? Propose the concrete policy change.
      5. DATA RETENTION AND DELETION — the legal pages in app/(marketing)/legal
         (privacy, dpa, terms) make claims. Check whether the app can actually
         honour them: is there a user-deletion path that removes a user's data
         across ALL tables? Is there a tenant offboarding path that removes their
         PII? Does the backup/export feature keep exporting deleted users' data?
         Note: PropDesk's own privacy page makes promises — read it and report
         gaps between claim and implementation. This is a legal-risk finding.
      6. AUDIT LOGGING — is there any record of who read/changed sensitive data?
         Propose a minimal, privacy-preserving audit log design (table shape,
         what to log, retention, and how to avoid logging PII itself).

      ## Output — write THREE files
      A) /workspace/propdesk/audit/findings/crypto.md — the findings and data
         inventory, each with ID, severity, file:line, impact, and fix.
      B) /workspace/propdesk/audit/findings/crypto.json — schema:
         { "task": "audit-crypto", "findings": [ { "id": "CRYPTO-001", "severity":
         "CRITICAL|HIGH|MEDIUM|LOW", "category": "plaintext-pii|weak-compare|
         missing-storage-policy|retention-gap|missing-audit-log|key-management|legal-claim-gap",
         "title", "file", "lines", "evidence", "impact", "fix", "status": "OPEN" } ] }
      C) /workspace/propdesk/audit/design/encryption-design.md — the implementation
         spec the next cycle will follow. It MUST contain: the exact TypeScript
         source of the proposed lib/crypto/field-encryption.ts (real, compilable
         TypeScript, using node:crypto), the exact env var names and how to
         generate the keys (`openssl rand -base64 32`), the key-rotation procedure,
         the blind-index helper, the per-column encryption plan table (column,
         class, mode = deterministic/randomised, lookup strategy), the read-path
         and write-path migration steps, the backfill script outline, and the
         rollout order. It must be specific enough that an implementer can code
         from it without asking questions.

      Do not implement anything in this track. Design only. Every finding cites
      file:line. Do not pad.
    verify_prompt: |
      Read-only verification. Do not modify project files.
      Verify /workspace/propdesk/audit/design/encryption-design.md and
      /workspace/propdesk/audit/findings/crypto.{md,json}.
      1. Check the design's TypeScript for correctness: does the AES-256-GCM usage
         match Node's actual API (createCipheriv with a 12-byte IV, authTag
         retrieval, correct tag length)? Is the encode/decode of the `v1:` envelope
         unambiguous? Are there buffer/encoding bugs (e.g. mixing base64 of
         concatenated buffers without fixed offsets)? Is key length validated?
      2. Check the design's claims against the actual repo: does the table it
         names actually exist in db/migrations/*.sql? Are the columns it says are
         plaintext actually stored plaintext? Open the cited file:line.
      3. Check the timingSafeEqual guidance is correct about the equal-length
         requirement.
      4. Independently verify the legal-claim gap finding: open the privacy/DPA
         pages under app/(marketing)/legal and confirm the specific claim that is
         not implemented by the code.
      5. Check the design does not propose storing keys in the repo, logging
         secrets, or sending plaintext to the client after "encryption".
      FAIL if: the proposed code would not compile or is cryptographically wrong;
      the data inventory contradicts the migrations; a cited file:line does not
      resolve; the JSON shape is invalid; or you find a plaintext-PII column the
      design missed. PASS if the design is implementable, correct, and grounded
      in the real schema. State exactly what is wrong when you FAIL.

