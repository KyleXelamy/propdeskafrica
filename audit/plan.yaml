version: 1
plan:
  name: 'PropDesk Africa — pre-launch security, leak, feature-completion and hardening audit'
  max_concurrency: 6
  max_consecutive_failures: 3
  max_cycles: 8
tasks:
  # =========================================================================
  # CYCLE 1 — PARALLEL READ-ONLY AUDIT TRACKS
  # Every track writes ONLY into /workspace/propdesk/audit/findings/
  # so the five tracks never touch the same file.
  # =========================================================================

  - id: audit-authz
    title: 'Audit authentication, authorization and tenant isolation'
    assigned_to: General
    verified_by: Verifier
    timeout_ms: 1800000
    prompt: |
      You are performing a READ-ONLY security audit of the PropDesk Africa codebase
      located at /workspace/propdesk. Do NOT modify any application source file. You
      may only create files under /workspace/propdesk/audit/findings/.

      ## Architecture you must reason against (verify it yourself, do not trust it blindly)
      - Next.js 16 App Router, React 19, TypeScript strict, Tailwind v4.
      - Auth: Supabase (cookie based, @supabase/ssr). Server validation uses
        supabase.auth.getUser() — NOT getSession().
      - Primary DB: Neon Postgres over the @neondatabase/serverless HTTP driver
        (lib/db/neon.ts). There is NO row-level security on Neon. Every query must be
        scoped by the authenticated user's id in application code. lib/api/with-db-auth.ts
        documents this: "The handler must explicitly scope every query by userId".
      - Storage (avatars, documents, property photos): Supabase Storage.
      - Billing: Stripe. Mobile money: Safaricom Daraja M-Pesa (lib/mpesa/daraja.ts).
      - ~90 route handlers under app/api/**/route.ts, plus lib/actions.ts and
        lib/actions/settings.ts server actions, plus 85 page.tsx files.

      ## Your scope: ONLY auth, authz, tenancy and IDOR
      1. Enumerate EVERY app/api/**/route.ts. For each, determine:
         - Is authentication enforced? (withDbAuth / withAuth / getUser / service-role path)
         - Which routes are intentionally public (marketing content, health, webhooks)
           and which are NOT intentionally public but are unauthenticated?
         - Is the authenticated user id used to scope every SELECT / UPDATE / DELETE?
         - For routes taking an id from path or body (properties, tenants, payments,
           notes, maintenance, documents, expenses, quotations, backups, templates,
           reconciliation, notifications, damages): can user A pass user B's id and
           read or mutate B's data? Check the ownership predicate on EVERY query.
         - Service-role Supabase client usage (lib/supabase/service.ts): which routes
           use it, and do they correctly re-implement the ownership check that RLS
           would normally provide? A service-role key bypasses RLS — every such route
           needs an explicit owner check, and any that lacks one is CRITICAL.
         - Role/privilege model: is there a role column (landlord/tenant/admin)? Can a
           normal user escalate to admin by setting a role/company_id field in a
           request body? Check tenant portal routes (tenant-pay-rent, tenant invite,
           tenant paybill) — can a landlord's tenant see other tenants?
         - Mass assignment: do POST/PATCH handlers spread the raw request body into a
           database insert/update, allowing overwriting user_id, role, status, or
           organization_id?
         - Server actions in lib/actions.ts and lib/actions/settings.ts: same checks.
         - Middleware (middleware.ts, lib/supabase/middleware.ts): does the matcher
           actually cover the routes that need protection? Is email verification
           enforced where required? Can the middleware be bypassed by a path that
           does not match the pattern (e.g. trailing slash, encoded slash, case)?
      2. For each finding, prove exploitability by quoting the exact file and line
         range and tracing the request from entry point to the un-scoped query.

      ## Output — write BOTH files
      A) /workspace/propdesk/audit/findings/authz.md
         Human-readable report. Per finding: ID, severity, title, file:line, the
         vulnerable code quoted, the attack path, impact, and the concrete fix
         (with a short code sketch that matches the repo's existing style).
      B) /workspace/propdesk/audit/findings/authz.json
         Machine-readable, exactly this shape:
         {
           "task": "audit-authz",
           "findings": [
             {
               "id": "AUTHZ-001",
               "severity": "CRITICAL|HIGH|MEDIUM|LOW",
               "category": "missing-auth|missing-ownership-check|privilege-escalation|mass-assignment|service-role-bypass|middleware-bypass|auth-bypass",
               "title": "...",
               "file": "app/api/.../route.ts",
               "lines": "10-42",
               "evidence": "the exact vulnerable code",
               "impact": "what an attacker can do",
               "fix": "concrete remediation",
               "status": "OPEN"
             }
           ]
         }
      Severity rules: CRITICAL = unauthenticated access to tenant data, auth bypass,
      cross-tenant read/write of another landlord's data, or privilege escalation to
      admin. HIGH = authenticated IDOR / missing ownership check. MEDIUM = missing
      defence-in-depth (no ownership check on a non-sensitive table). LOW = nit.
      If you find zero findings in a category, say so explicitly in authz.md — do not
      pad the report. Accuracy over volume. Every finding must cite file:line.
    verify_prompt: |
      Read-only verification. Do NOT modify any file under /workspace/propdesk except
      nothing at all — you must not edit project files.
      Independently audit the auth/authz surface of /workspace/propdesk. Do NOT trust
      /workspace/propdesk/audit/findings/authz.md or authz.json — re-derive from source.
      Pick the 8 most security-relevant route handlers yourself (include at least one
      app/api/backup/*, one app/api/documents/*, one app/api/tenants/*, one app/api/payments/*,
      one app/api/migrations/*, one app/api/cron/*, one app/api/stripe/webhook/*, one
      app/api/backup/csv/* route) and for each independently determine: is auth
      enforced, is every query scoped to the caller, can a caller pass another
      tenant's id, and does a service-role key bypass the ownership check.
      Then reconcile against authz.json: every finding you independently confirm must
      appear with correct severity and a valid file:line reference; every CRITICAL/HIGH
      claim in authz.json that you CANNOT independently confirm from source is a
      fabricated or overstated finding and must be flagged.
      Also check for findings the report MISSED in those same files.
      FAIL if: any file:line reference does not resolve to the quoted code; any
      CRITICAL/HIGH finding cannot be independently re-derived; the JSON shape does
      not match the required schema; or there are missed CRITICAL/HIGH authz issues in
      the routes you audited. PASS if the report is accurate, complete for its scope,
      and the JSON is schema-valid. List precisely what is wrong when you FAIL.

  - id: audit-leaks
    title: 'Hunt secrets, PII leaks, placeholder and mock data shipped to production'
    assigned_to: General
    verified_by: Verifier
    timeout_ms: 1800000
    prompt: |
      READ-ONLY audit of /workspace/propdesk. Do NOT modify application source. You may
      only create files under /workspace/propdesk/audit/findings/.

      Context: PropDesk Africa is a property-management SaaS for landlords and tenants
      (Kenya-focused, M-Pesa + Stripe). It is about to be launched publicly. The owner
      suspects the codebase is full of placeholders, mock data and half-finished
      wiring, and wants leaks identified.

      ## Scope A — secrets and credentials
      1. Search the whole repo (including scripts/, db/, supabase/, supabase-setup/,
         public/, .v0-assets/, docs, CSV/DOCX/SQL assets, next.config.mjs) for:
         - hardcoded API keys, tokens, passwords, connection strings, private keys
         - Supabase service-role keys, anon keys, JWTs
         - Neon / Postgres URLs, Stripe secret keys, M-Pesa passkey / consumer secret /
           business shortcode / security credential
         - real customer data, real emails, real phone numbers, national ID numbers
         - anything that looks like a production credential committed to the repo
         - .env files or .env.example containing real values instead of placeholders
         - credentials embedded in the committed package-lock/pnpm-lock or in the
           public/ folder or in a built asset
      2. For each env var read in the code (grep process.env), report whether it is
         read on the server only or exposed to the browser via NEXT_PUBLIC_*. Flag any
         secret that is NEXT_PUBLIC_, and any secret that is logged, echoed in an API
         response, or sent to the client.
      3. Check .gitignore and .gitattributes — is .env actually ignored? Are any
         files that SHOULD be ignored (backups, dumps, .docx templates with data,
         csv exports) currently tracked?

      ## Scope B — data leaks in responses and logs
      1. Do any API routes return full user/tenant/landlord records when the caller
         only needs a subset? Specifically hunt for national ID / ID number, phone,
         email, address, M-Pesa phone numbers, bank/transaction identifiers being
         returned where they are not needed.
      2. Do any routes return raw database error messages, stack traces, SQL text, or
         internal identifiers (table names, column names, uuids of other users) to the
         client? Check the catch blocks — a common pattern is
         NextResponse.json({ error: e.message }, 500).
      3. Do server logs (console.log / console.error) print PII, tokens, session
         cookies, Authorization headers, or full request bodies? List the specific
         call sites.
      4. Do error responses or analytics (next.config.mjs has @vercel/analytics)
         capture identifiable user data?

      ## Scope C — placeholder / mock / demo data that will ship
      1. Find every mock / demo / sample / fake / hardcoded dataset used in a code
      path that a real user can reach: hardcoded arrays of properties, tenants,
      payments, testimonials, company names, currency amounts, stats, charts.
      2. Find UI text that promises functionality that is not implemented: "coming
         soon", "TODO", "not implemented", disabled buttons with no handler, empty
         onClick, "this is a demo", lorem ipsum.
      3. Find features whose write path is fake: a form that POSTs to a stub, an
         "Export" button that returns a static file, a "Send" that only logs.
      4. Find sample credentials shipped to the user: demo logins, default passwords,
         seed scripts that run in production, "admin/admin" defaults.
      5. Check public/ and .v0-assets/ for real internal assets, exported data files,
         backup dumps, or documents that should not be public.

      ## Output — write BOTH files
      A) /workspace/propdesk/audit/findings/leaks.md — human-readable, grouped by
         Scope A / B / C, each finding with ID, severity, file:line, quoted evidence,
         impact, and concrete fix.
      B) /workspace/propdesk/audit/findings/leaks.json — same schema as the authz
         one, with "task": "audit-leaks", ids prefixed LEAK-, and category one of
         hardcoded-secret|secret-exposed-to-client|pii-in-response|pii-in-logs|verbose-error|placeholder-data|mock-feature|shipped-sample-data|gitignore-gap|public-asset-leak.
      Severity: CRITICAL = live credential or service-role key in the repo, or real
      customer PII exposed. HIGH = placeholder/mock data reachable in a production
      path, or PII returned/logged beyond need. MEDIUM = verbose errors, internal
      identifiers, missing .gitignore entries. LOW = copy/demo text.
      Every finding must cite file:line. Do not pad — if a section is clean, say so.
    verify_prompt: |
      Read-only verification. Do not modify any project file.
      Independently verify /workspace/propdesk/audit/findings/leaks.md and leaks.json
      against the source. Do not re-read the producer's reasoning as evidence.
      Independently run your own greps for hardcoded credentials (Supabase service
      role keys, Stripe sk_/whsec, M-Pesa credentials, Neon connection strings,
      JWTs, private keys), for PII fields (national id, phone, email) being returned
      in API responses, for console logging of sensitive values, and for mock/demo
      datasets in reachable code paths. Spot-check 6 of the producer's findings by
      opening the cited file:line and confirming the quoted evidence is really there.
      Confirm every claimed credential is genuinely a secret and not a placeholder
      string like "your-key-here" or a public anon key.
      FAIL if: any cited file:line does not contain the quoted evidence; a claimed
      credential is actually a placeholder/public value; a claimed PII field is not
      actually PII; the JSON shape is invalid; or you independently find a
      CRITICAL/HIGH leak the report missed. PASS if accurate, scoped, and
      schema-valid. State exactly what is wrong when you FAIL.

  - id: audit-infra
    title: 'Audit infrastructure exposure, hardening posture and data-plane attack surface'
    assigned_to: General
    verified_by: Verifier
    timeout_ms: 1800000
    prompt: |
      READ-ONLY audit of /workspace/propdesk. Do NOT modify application source. Only
      create files under /workspace/propdesk/audit/findings/.

      Context: Next.js 16 App Router deployed on Vercel. Database is Neon Postgres
      (HTTP driver). Supabase is used for auth + storage. Stripe and Safaricom Daraja
      M-Pesa handle money. The owner explicitly asked about "cases where we have
      exposed our infrastructure" and about "design flaws". This track is the
      infrastructure-exposure track.

      ## Scope
      1. ROUTE EXPOSURE — enumerate every app/api/**/route.ts and classify it as
         public-by-design, authenticated, or admin/internal. Flag:
         - destructive or privileged endpoints reachable without authentication or
           without an admin check: app/api/migrations/run, /reset, /rollback,
           app/api/cron/run, app/api/system/*, app/api/backup/*, app/api/export,
           app/api/backup/csv/[table], app/api/reconciliation/bulk
         - whether MIGRATION_SECRET, CRON_SECRET, BACKUP_CRON_SECRET are actually
           required and compared in constant time, or only mentioned in a comment
         - whether a secret is accepted via query string (which lands in logs and
           referrers) instead of a header
         - the CSV export route's table parameter — is it an allowlist or does it
           interpolate a user-supplied table name into SQL? Trace it.
      2. SQL INJECTION — hunt for string concatenation / template interpolation of
         user input into SQL passed to the Neon sql`` template. The Neon driver
         parameterises `` `...` `` tagged templates, so the real risk is
         ${ } interpolation building the SQL STRING rather than binding a value.
         Look for `sql`SELECT ... ${table}``, `sql`... ${id} ...``, ORDER BY
         ${sort}, LIKE patterns, and any `+` concatenation. Also check lib/db/migrate.ts
         and db/migrations/*.sql for the same. Every hit must show the exact
         interpolation and whether the value is validated/allowlisted first.
      3. SSRF — look at app/api/geocode/route.ts, app/api/properties/[id]/geocode/route.ts,
         any URL fetching (lib/content, blog/feed fetchers, changelog, roadmaps, news,
         any image proxy). Can a user supply a URL that the server fetches? Is there
         an allowlist, a private-IP block, a redirect-following block?
      4. FILE UPLOAD — app/api/documents/upload/route.ts and property photos.
         Check: content-type and magic-byte validation, size limits, filename
         sanitisation, path traversal in the stored name, whether uploads land in a
         public bucket, and whether the Supabase Storage bucket policies restrict
         who can read a file by path.
      5. WEBHOOK VERIFICATION — app/api/stripe/webhook/route.ts and the M-Pesa
         callbacks (app/api/mpesa/callback/route.ts, c2b/*). Is the Stripe
         signature verified with the raw request body? Is the M-Pesa callback
         authenticated (IP allowlist / shared secret / signature)? What happens if
         the callback says "payment succeeded" — can it mark an invoice paid without
         real money having moved? Is the amount validated against the invoice?
      6. HEADERS AND BROWSER SECURITY — next.config.mjs sets some headers. Assess
         what is MISSING: Content-Security-Policy (report-only at minimum, then
         enforced), X-Frame-Options vs frame-ancestors, HSTS preload +
         includeSubDomains, X-XSS-Protection, Cross-Origin-Opener-Policy,
         Cross-Origin-Resource-Policy, Referrer-Policy value, Permissions-Policy
         completeness. Also check for a missing/incomplete CSP allowing unsafe-inline
         script, and whether react is used dangerouslySetInnerHTML anywhere
         (grep dangerouslySetInnerHTML) — that is a stored-XSS vector.
      7. RATE LIMITING AND ABUSE — is there ANY rate limiting on auth endpoints,
         password reset, sign-up, contact forms, newsletter, M-Pesa STK push,
         checkout, and the free-tier lead forms? Public marketing forms with no rate
         limit = spam/DoS and email-bombing.
      8. SESSION AND COOKIE POSTURE — cookie flags (httpOnly, secure, sameSite),
         session refresh behaviour in lib/supabase/middleware.ts, session fixation,
         absence of session revocation, token lifetime.
      9. CONFIG AND SUPPLY CHAIN — next.config.mjs has
         `typescript.ignoreBuildErrors: true` (report it: real type errors will ship
         silently). `images.unoptimized: true`. `poweredByHeader: false` is good.
         Check for a missing "Content-Security-Policy" report, non-HTTPS redirect
         enforcement, and whether a `vercel.json` or equivalent exists. Check
         package.json for dependencies with known critical advisories (npm audit if
         network allows; otherwise flag the ones you can reason about: next ^16.3.8,
         @supabase/supabase-js ^2.116.0, stripe ^23.0.0, ws ^8.22.0, docx ^9.9.0,
         next-auth is NOT used).
      10. DESIGN FLAWS — architectural issues that create risk: the dual
          Neon/Supabase database fallback (lib/db/neon.ts returns DATABASE_URL ||
          POSTGRES_URL || POSTGRES_PRISMA_URL, and lib/supabase/server.ts is a
          fallback path) meaning two sources of truth and two different security
          models; the fact that the app enforces tenancy in application code with no
          RLS as a safety net; the "backup" feature exporting the whole database to
          CSV; the MIGRATION_SECRET pattern; and the fact that marketing and
          dashboard share one Next app and one middleware matcher.

      ## Output — write BOTH files
      A) /workspace/propdesk/audit/findings/infra.md — human-readable, grouped by
         the numbered scope above, each finding with ID, severity, file:line, quoted
         evidence, impact, and concrete fix.
      B) /workspace/propdesk/audit/findings/infra.json — schema:
         { "task": "audit-infra", "findings": [ { "id": "INFRA-001", "severity":
         "CRITICAL|HIGH|MEDIUM|LOW", "category": "unauth-admin-endpoint|secret-handling|sql-injection|ssrf|file-upload|webhook-verification|missing-security-header|xss|rate-limiting|session-cookie|config|supply-chain|design-flaw",
         "title", "file", "lines", "evidence", "impact", "fix", "status": "OPEN" } ] }
      Severity: CRITICAL = unauthenticated destructive access, live secret exposure,
      confirmed SQLi, unauthenticated payment-mutation. HIGH = SSRF, unverified
      webhook with financial impact, upload bypass, missing auth on sensitive
      route. MEDIUM = missing header, missing rate limit, config weakness.
      LOW = nit. Every finding cites file:line. Do not pad.
    verify_prompt: |
      Read-only verification. Do not modify any project file.
      Independently verify the infra findings in /workspace/propdesk/audit/findings/.
      Do not accept the producer's conclusion — re-derive. Specifically:
      1. Open app/api/migrations/run/route.ts, app/api/migrations/reset/route.ts,
         app/api/migrations/rollback/route.ts, app/api/cron/run/route.ts,
         app/api/backup/csv/[table]/route.ts, app/api/export/route.ts and determine
         for each: what authenticates the caller, what secret is checked, and whether
         the secret comparison is constant-time. Then TRY to call one of these
         routes unauthenticated and report the actual response.
      2. Open app/api/stripe/webhook/route.ts and app/api/mpesa/callback/route.ts
         and independently determine whether the payload is authenticated and whether
         the amount is bound to an invoice.
      3. Grep for real SQL string interpolation and independently confirm or refute
         the SQLi claims.
      4. Grep for dangerouslySetInnerHTML and independently check the XSS claim.
      5. Check next.config.mjs for the headers actually present vs claimed missing.
      6. Spot-check 5 findings by file:line.
      FAIL if: a claimed vulnerability does not exist in the code; a cited file:line
      does not resolve; a CRITICAL claim is overstated (e.g. the route IS
      authenticated and you did not notice); the JSON shape is invalid; or you
      independently find a CRITICAL/HIGH infra issue the report missed.
      PASS if accurate, scoped and schema-valid. State exactly what is wrong on FAIL.

  - id: audit-features
    title: 'Inventory half-done features, dead UI and incomplete wiring'
    assigned_to: General
    verified_by: Verifier
    timeout_ms: 1800000
    prompt: |
      READ-ONLY audit of /workspace/propdesk. Do NOT modify application source. Only
      create files under /workspace/propdesk/audit/findings/.

      Context: PropDesk Africa is a property-management SaaS (Next.js 16 App Router,
      React 19) that is about to go live. The owner says the app is "missing too
      much" and has "half-done features" and wants them COMPLETED, not just listed.
      This track produces the authoritative completion backlog AND, where a feature
      is self-contained and low-risk, actually implements the simplest ones.

      ## Phase 1 — inventory (read-only)
      1. Walk the full route tree. List every page under app/(marketing) and
         app/dashboard. For each, determine: is it a real page with a real data
         source, a static shell, a stub, or a redirect?
      2. Grep the whole repo for: TODO, FIXME, XXX, HACK, "not implemented",
         "coming soon", "coming soon!", "under construction", "placeholder",
         "mock", "dummy", "sample", "demo", "dummy data", "hardcoded", "temporary",
         "for now", "will be", "in the future", "lorem", "TBD", "WIP".
         Produce a classified list — a TODO inside a comment that describes work
         genuinely NOT done is a finding; a TODO about a code style nit is not.
      3. Trace the UI-to-API wiring. For every form component in components/
         (contact-form, document-upload-form, expense-form, login-form,
         maintenance-form, marketing-sales-form, mpesa-pay-button, newsletter-form,
         note-form, paybill-account-form, payment-form, property-form,
         reconciliation-review-queue, submit-idea-form, tenant-form, tenant-pay-rent,
         feedback-board, backup-manager, expense-recurring-control, recurring-expenses-panel,
         property-photo-gallery, property-map, search-input, resource-search,
         subscription-controls, system-info, notifications-bell, trial-banner,
         live-paybill-feed, delete-button, tenant-invite-card, dashboard-widgets):
         does it POST/PUT to a real route that persists to the DB, or is the handler
         a stub / console.log / local state only?
      4. For every dashboard page, check the data path: does it read real rows, or
         does it render hardcoded arrays? Check app/dashboard/finances/payments/new,
         app/dashboard/reconciliation, app/dashboard/quotations, app/dashboard/reports,
         app/dashboard/notes, app/dashboard/maintenance, app/dashboard/paybill,
         app/dashboard/contacts, app/dashboard/settings/system, app/dashboard/settings/backup,
         app/dashboard/templates, app/dashboard/properties/map.
      5. Find UI that navigates to a non-existent route, or a route that exists but
         renders nothing. Find buttons with no handler, forms with no action, and
         tables with a permanent "coming soon" empty state where a real API exists.
      6. Find error handling that silently swallows failures (empty catch blocks,
         catch that returns [] or null), which is how "half-done" hides in production.
      7. Check the auth pages for completeness: forgot-password, reset-password,
         verify-email, sign-up, callback. Do they actually call Supabase and handle
         the error states?
      8. Check lib/actions.ts and lib/actions/settings.ts — server actions that are
         defined but never called, or called but not defined.
      9. Check lib/reconcile.ts + lib/reconcile.test.ts — is reconciliation logic
         complete and actually wired to the API routes?
      10. Check lib/templates/, lib/backup.ts, lib/system.ts, lib/brand.ts,
         lib/pricing.ts — which are complete and which are partial?

      ## Phase 2 — complete the low-risk, self-contained ones
      You MAY implement fixes, but ONLY for findings you classify as
      "small" (LOW effort): a static page that should show real content from an
      existing data source, a form that should post to an existing endpoint, a
      dead link, a missing "use client" that breaks a component, an obviously
      wrong empty state, a TODO that is a one-line fix.
      You MUST NOT implement anything that touches authentication, payments,
      database schema, or anything marked CRITICAL/HIGH. Leave those to the
      security hardening track.
      Only edit files under /workspace/propdesk/app, /workspace/propdesk/components,
      /workspace/propdesk/hooks and /workspace/propdesk/lib. Do NOT create or edit
      any file under /workspace/propdesk/audit/ except your own two findings files.
      Do NOT run `git commit`.

      ## Output — write BOTH files
      A) /workspace/propdesk/audit/findings/features.md — human-readable: a table of
         every incomplete feature with ID, area, file:line, what's missing, effort
         (SMALL/MEDIUM/LARGE), risk (LOW/MEDIUM/HIGH), and the recommended
         completion approach. Then a section "Completed in this track" listing what
         you actually implemented, with files changed and the behaviour change.
      B) /workspace/propdesk/audit/findings/features.json — schema:
         { "task": "audit-features", "findings": [ { "id": "FEAT-001", "severity":
         "HIGH|MEDIUM|LOW", "category": "stub-page|mock-data|dead-ui|unwired-form|broken-link|empty-catch|missing-error-state|unwired-action|incomplete-logic",
         "title", "file", "lines", "evidence", "impact", "fix", "effort": "SMALL|MEDIUM|LARGE", "status": "OPEN" } ] }
      Every finding cites file:line. Do not pad. Distinguish genuinely unfinished
      work from intentional marketing copy.
    verify_prompt: |
      Read-only verification of the feature-completion work. Do not modify project files.
      Independently verify /workspace/propdesk/audit/findings/features.json and
      features.md against the code. Do not take the producer's word for it.
      1. Spot-check 8 findings by opening the cited file:line and confirming the
         feature really is incomplete (a static page with no data source, a form
         with no endpoint, a dead link target that does not exist).
      2. Independently look for at least 5 features that the report MISSED — search
         the dashboard tree for pages that render hardcoded arrays, grep for forms
         with no fetch/action, and grep for catch blocks that swallow errors.
      3. For everything the producer claims it implemented (the "Completed in this
         track" section), verify the change actually exists in the working tree and
         that it is correct — in particular that it did NOT touch auth, payments,
         DB schema, or anything CRITICAL/HIGH, and that it did not break the build.
         Run `npx tsc --noEmit` if node_modules is present in /workspace/propdesk and
         report the result. If the repo has pre-existing type errors, compare against
         the baseline and report only NEW errors.
      4. Check for regressions: did any "completed" feature break a real API contract
         or remove working behaviour?
      FAIL if: a claimed incomplete feature is actually complete; a cited file:line
         does not resolve; the implemented changes touched auth/payments/schema or
         introduced new type errors; the JSON shape is invalid; or you found
         significant missed features. PASS if accurate, scoped, and the implemented
