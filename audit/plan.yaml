  - id: fix-critical-security
    title: 'Implement fixes for all CRITICAL and HIGH security findings'
    assigned_to: Coder
    depends_on: [audit-authz, audit-leaks, audit-infra]
    verified_by: Verifier
    timeout_ms: 1800000
    prompt: |
      You are the implementing engineer for PropDesk Africa at /workspace/propdesk.
      The audit tracks have completed. You must now FIX the code.

      ## READ FIRST: /workspace/propdesk/audit/ENVIRONMENT.md
      It records the already-completed environment setup (node_modules installed, the
      54 pre-existing tsc errors that are the BASELINE and not yours to fix, the
      3 passing baseline tests, the architecture cheat-sheet, the severity ladder,
      and the global ground rules: no git commit, do not touch audit/findings/
      except your own files, zero NEW type errors, suite must stay green).

      ## Inputs — read these first
      - /workspace/propdesk/audit/findings/authz.md + authz.json
      - /workspace/propdesk/audit/findings/leaks.md + leaks.json
      - /workspace/propdesk/audit/findings/infra.md + infra.json
      Every finding you act on must have a real file:line you have personally opened
      and confirmed. If you believe a finding is wrong, do not silently skip it —
      mark it WONT_FIX in the JSON with a one-line justification and report it.

      ## Scope — implement fixes for
      - ALL CRITICAL findings (must be 100% fixed — these are launch blockers)
      - ALL HIGH findings (fix them all; if one genuinely cannot be fixed without
        a product decision, mark it WONT_FIX with the exact question for the owner)
      Do NOT implement MEDIUM/LOW in this task — a later task handles those, and
      doing them here risks breaking the build. Exception: if a MEDIUM fix is a
      one-liner that is clearly coupled to a HIGH fix you are already making, do it
      and note it.

      ## Non-negotiable constraints
      1. Do NOT change the public API contract of any existing route (request
         shape, response shape, status codes) unless the fix requires it. If you
         must, document it loudly in your report and in a CHANGELOG-style section.
      2. Do NOT change the database schema. No new migrations in this task. If a
         finding genuinely requires a schema change, mark it WONT_FIX and explain.
      3. Preserve the existing code style: TypeScript strict, 2-space indent,
         no semicolon-style churn, zod for validation, `withDbAuth`/`withAuth`
         wrappers for authenticated routes, `jsonError`/`DbHttpError` for errors.
      4. Keep the app buildable. The repo has `typescript.ignoreBuildErrors: true`
         in next.config.mjs — that does NOT excuse introducing new type errors.
         Run `npx tsc --noEmit` in /workspace/propdesk if node_modules is present
         and make sure you introduce NO new type errors relative to the baseline
         (capture the baseline first with `git stash`/restore or by noting the
         pre-existing error list before you start). Report the baseline count and
         the post-fix count.
      5. Do NOT run `git commit`. Leave everything in the working tree.
      6. Do NOT create files outside /workspace/propdesk (except under
         /workspace/propdesk/audit/ for your own report).
      7. Do not weaken a fix by simply returning 403 where a real fix is required.

      ## Expected shape of the fixes
      - Missing authentication → wrap the handler in the existing auth helper, or
        add an explicit session check matching the pattern already used elsewhere
        in the repo. Look at how a correctly-protected route does it and match it.
      - Missing ownership check → add the owner predicate to EVERY affected query,
        not just the one named in the finding. Re-read the whole handler.
      - Mass assignment → build an explicit allowlisted payload object instead of
        spreading the request body. Use zod where the repo already uses it.
      - Secret comparison → use crypto.timingSafeEqual with an equal-length guard.
      - SQL string interpolation → convert to a bound parameter, or to a
        strict allowlist when the value is an identifier (e.g. a table name).
      - Verbose errors → return a generic message to the client and log the detail
        server-side only.
      - Secret in NEXT_PUBLIC_* or logged → move it server-side and stop logging it.
      - Missing security header → add it in next.config.mjs `headers()` alongside
        the existing ones.
      - Missing auth on admin route → enforce the admin role check the app already
        models (check how a role is stored and read before you use it).

      ## Output
      1. Update the findings JSON files you acted on: for each finding, set
         "status" to "FIXED" or "WONT_FIX", and add a "fix_notes" field
         describing the change and naming the file:line you changed.
      2. Write /workspace/propdesk/audit/deliverable-fix-security.md listing:
         every finding acted on with its ID, severity, status, files changed, a
         one-line description of the change, and the verification you performed
         (command + result). Also list, prominently, anything left WONT_FIX and
         why. Also state the tsc baseline vs post-fix error count.
      3. Also write the fixed code — the verifier will try to break it.
    verify_prompt: |
      You are an adversarial security verifier. READ-ONLY on project files: you must
      NOT edit, create or delete any file under /workspace/propdesk except nothing.
      Do not fix anything yourself.

      Your job: try to BREAK the fixes that were just made, and independently
      confirm the audit findings are genuinely closed.

      1. Get the changed file set: run `git -C /workspace/propdesk status --porcelain`
         and `git -C /workspace/propdesk diff --stat` against the baseline commit
         (baseline commit id 467c500). For each changed file, read the actual diff.
      2. For every finding in authz.json, leaks.json and infra.json with severity
         CRITICAL or HIGH, independently verify the fix by reading the current
         source at the cited location and reasoning about the attack. Do not
         re-read the producer's deliverable as evidence — go to the source.
      3. ACTIVE PROBING — where you can, exercise the code. If node_modules exists
         you may write throwaway probe scripts ONLY under /tmp (never inside the
         repo) or use `npx tsx -e '...'` to import route modules and call the
         exported handler directly with a forged NextRequest. Try:
         - calling a protected route handler with no session and asserting it
           returns 401/403
         - calling a protected route with a session whose user id differs from the
           resource id in the path, asserting it returns 404/403 and NOT the other
           user's data
         - posting an extra field like `user_id`, `role`, `organization_id`,
           `status` in the body and asserting it is ignored
         - calling the migrations/cron/export/backup-csv routes with no secret
         - replaying a forged Stripe webhook without a valid signature
         Confirm the actual observed response, and quote it.
      4. Check for OVER-FIXING and REGRESSIONS: did a fix break a legitimate
         public route (marketing content, health, newsletter, contact, the
         M-Pesa callback, the Stripe webhook)? Did any fix change a response
         shape that the frontend still depends on? Did any fix introduce a new
         type error? Run `npx tsc --noEmit` in /workspace/propdesk and compare
         against the baseline error list.
      5. Confirm no secrets were introduced into the client bundle: grep the diff
         for NEXT_PUBLIC_ additions and for any literal key material.
      6. Confirm the producer did not simply widen scope: check that no MEDIUM/LOW
         finding was silently "fixed" in a way that changes unrelated behaviour.

      FAIL if: any CRITICAL or HIGH finding is NOT actually closed; any fix can be
      bypassed (e.g. a check on a different field than the one the attacker
      controls); a legit public route now 401s; a response contract changed
      without need; a new type error was introduced; a secret was exposed to the
      client; or the producer claimed a fix that is not in the code.
      PASS only if every CRITICAL/HIGH finding is demonstrably closed, regressions
      are absent, and no new type errors exist. On FAIL, list each problem with
      file:line and the exact probe output that demonstrates it.

